name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy_tag:
        description: Immutable image tag to deploy on the production host
        required: true
        type: string

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  # La configuracion de ruff/mypy vive en src/backend/pyproject.toml; se aplica de
  # forma explicita para que `tests/` no se lint-e con los valores por defecto.
  RUFF_CONFIG: src/backend/pyproject.toml
  PYTEST_CMD: python -m pytest tests -c src/backend/pyproject.toml --cov-report=xml --cov-fail-under=100

jobs:
  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/backend/pyproject.toml
      - name: Install backend with dev extras
        working-directory: src/backend
        run: python -m pip install -e ".[dev]"
      - name: Ruff lint
        run: python -m ruff check --config "${{ env.RUFF_CONFIG }}" src/backend tests
      - name: Ruff format check
        run: python -m ruff format --check --config "${{ env.RUFF_CONFIG }}" src/backend tests
      - name: Mypy
        run: python -m mypy --config-file src/backend/pyproject.toml src/backend
      - name: Bandit
        run: python -m bandit -r src/backend -ll

  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
      RATE_LIMIT_LOGIN_ATTEMPTS: "10000000"
      RATE_LIMIT_DEFAULT_REQUESTS: "10000000"
      # Credencial de pruebas, no secreta: debe coincidir con ADMIN_PASSWORD en
      # tests/conftest.py y solo existe en este job efimero de CI.
      SIGEM_BOOTSTRAP_PASSWORD: "SigemAdmin2026!"
      SIGEM_BOOTSTRAP_USERNAME: admin
      SIGEM_BOOTSTRAP_MUNICIPIO: "00000"
      # La suite necesita una cuenta operativa; en produccion el cambio de clave
      # en el primer ingreso sigue siendo obligatorio.
      SIGEM_BOOTSTRAP_MUST_CHANGE_PASSWORD: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/backend/pyproject.toml
      - name: Install backend with dev extras
        working-directory: src/backend
        run: python -m pip install -e ".[dev]"
      - name: Apply database migrations
        # Sin este paso la suite falla con `relation "municipios" does not exist`:
        # las fixtures de integracion necesitan esquema, catalogos y el municipio 00000.
        run: python -m alembic -c alembic.ini upgrade head
      - name: Bootstrap test administrator
        # Crea el usuario `admin` que usan las fixtures (tests/conftest.py).
        # PYTHONPATH hace accesible el paquete `src` desde la raiz del repo.
        run: PYTHONPATH=. python scripts/setup/bootstrap_admin.py
      - name: Run backend test suite
        run: ${{ env.PYTEST_CMD }}
      - name: Coverage job summary
        if: always()
        run: |
          if [ -f coverage.xml ]; then
            {
              echo "## Backend coverage"
              echo '```'
              python -c "import xml.etree.ElementTree as ET; r = ET.parse('coverage.xml').getroot(); print('line-rate:', r.get('line-rate'), 'branch-rate:', r.get('branch-rate'), 'lines-covered:', r.get('lines-covered'), 'lines-valid:', r.get('lines-valid'))"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: error

  frontend-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Tests with coverage thresholds
        run: npm run test:coverage
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: src/frontend/coverage
          if-no-files-found: error
      - name: Build
        run: npm run build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: src/backend/pyproject.toml
      - name: Install backend with dev extras
        working-directory: src/backend
        run: python -m pip install -e ".[dev]"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: pip-audit dependency scan
        # CVE-2026-85394 (python-jose <=3.5.0, critico) no tiene version corregida.
        # Solo aplica cuando la verificacion usa una clave asimetrica; SIGEM firma
        # con secreto simetrico HS* y `validate_production()` rechaza cualquier
        # otro algoritmo, lo que hace la vulnerabilidad inaplicable.
        # Migrar a PyJWT sigue recomendado (ver context/decisions.md).
        run: >-
          python -m pip_audit
          --ignore-vuln PYSEC-2026-1325
          --ignore-vuln PYSEC-2026-3740
          --ignore-vuln CVE-2026-85394
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json
      - name: Install frontend dependencies
        # El manifiesto y el lockfile viven en src/frontend; desde la raiz
        # `npm ci` fallaba por no encontrar un lockfile.
        working-directory: src/frontend
        run: npm ci
      - name: npm audit production dependencies
        working-directory: src/frontend
        run: npm audit --omit=dev --audit-level=high

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/backend/Dockerfile
          push: false
          load: false
          tags: sigem-backend:sha-${{ github.sha }}
          cache-from: type=gha,scope=sigem-backend
          cache-to: type=gha,mode=max,scope=sigem-backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/frontend/Dockerfile
          push: false
          load: false
          tags: sigem-frontend:sha-${{ github.sha }}
          cache-from: type=gha,scope=sigem-frontend
          cache-to: type=gha,mode=max,scope=sigem-frontend

  deploy:
    runs-on: ubuntu-latest
    needs: [backend-quality, backend-tests, frontend-quality, security]
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Verify deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=""
          [ -z "$DEPLOY_HOST" ] && missing="$missing DEPLOY_HOST"
          [ -z "$DEPLOY_USER" ] && missing="$missing DEPLOY_USER"
          [ -z "$DEPLOY_PATH" ] && missing="$missing DEPLOY_PATH"
          [ -z "$SSH_PRIVATE_KEY" ] && missing="$missing SSH_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing required GitHub secrets:$missing"
            echo "Configure them in Settings > Secrets and variables > Actions (see docs/operations/ci-cd.md)."
            exit 1
          fi
      - name: Verify deploy tag
        env:
          DEPLOY_TAG: ${{ inputs.deploy_tag }}
        run: |
          if [ -z "$DEPLOY_TAG" ]; then
            echo "::error::The deploy_tag input is required to run a deployment."
            exit 1
          fi
      - name: Run deploy script on the production host
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            bash scripts/setup/deploy.sh "${{ inputs.deploy_tag }}"
