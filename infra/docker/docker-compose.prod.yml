name: sigem-prod

x-logging: &logging-json
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file:
      - ./.env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - sigem_internal
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *logging-json

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - ./.env.prod
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    networks:
      - sigem_internal
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *logging-json

  migrate:
    image: sigem-backend:${SIGEM_IMAGE_TAG:-latest}
    restart: "no"
    env_file:
      - ./.env.prod
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sigem_internal
    mem_limit: 1g
    cpus: 1.0
    logging: *logging-json

  backend:
    image: sigem-backend:${SIGEM_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/backend/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env.prod
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - evidencias:/data/evidencias
    networks:
      - sigem_internal
    mem_limit: 1g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/health/ready', timeout=5)\" 2>/dev/null || python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging: *logging-json

  frontend:
    image: sigem-frontend:${SIGEM_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/frontend/Dockerfile
    restart: unless-stopped
    networks:
      - sigem_internal
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *logging-json

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ../tls:/etc/nginx/tls:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - sigem_internal
      - sigem_public
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging: *logging-json

  backup:
    image: sigem-backup:${SIGEM_IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.backup
    restart: unless-stopped
    env_file:
      - ./.env.prod
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backups:/backups
      - evidencias:/data/evidencias:ro
    networks:
      - sigem_internal
    mem_limit: 512m
    cpus: 0.5
    logging: *logging-json

  prometheus:
    image: prom/prometheus:latest
    profiles:
      - monitoring
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    networks:
      - sigem_internal
    mem_limit: 1g
    cpus: 1.0
    logging: *logging-json

volumes:
  postgres_data:
  redis_data:
  evidencias:
  backups:
  prometheus_data:

networks:
  sigem_internal:
    driver: bridge
  sigem_public:
    driver: bridge
