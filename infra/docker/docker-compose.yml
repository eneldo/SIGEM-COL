services:
  # Backend API
  backend:
    build:
      context: ../..
      dockerfile: infra/docker/backend/Dockerfile
    container_name: sigem-backend
    ports:
      - "8001:8000"
    env_file:
      - ../../.env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - APP_NAME=SIGEM Colombia
      - DATABASE_URL=postgresql+asyncpg://sigem_app:${SIGEM_APP_PASSWORD}@postgres:5432/sigem_db
      - ALEMBIC_DATABASE_URL=postgresql+asyncpg://sigem:${POSTGRES_PASSWORD}@postgres:5432/sigem_db
      - REDIS_URL=redis://redis:6379/0
      - STORAGE_PATH=/data/evidencias
      - RATE_LIMIT_LOGIN_ATTEMPTS=200
    volumes:
      - storage_data:/data/evidencias
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sigem-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Frontend
  frontend:
    build:
      context: ../..
      dockerfile: infra/docker/frontend/Dockerfile
    container_name: sigem-frontend
    ports:
      - "3001:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sigem-network
    restart: unless-stopped

  # PostgreSQL
  postgres:
    image: postgres:17-alpine
    container_name: sigem-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=sigem
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=sigem_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sigem-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigem -d sigem_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: sigem-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - sigem-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  storage_data:

networks:
  sigem-network:
    driver: bridge
