version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: .
      dockerfile: infra/docker/backend/Dockerfile
    container_name: sigem-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-development}
      - APP_NAME=SIGEM Colombia
    volumes:
      - storage_data:/data/evidencias
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sigem-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend/Dockerfile
    container_name: sigem-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    networks:
      - sigem-network
    restart: unless-stopped

  # PostgreSQL
  postgres:
    image: postgres:17-alpine
    container_name: sigem-postgres
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-sigem}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-sigem_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sigem-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sigem} -d ${POSTGRES_DB:-sigem_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: sigem-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme_redis_password}
    volumes:
      - redis_data:/data
    networks:
      - sigem-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme_redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  storage_data:

networks:
  sigem-network:
    driver: bridge
