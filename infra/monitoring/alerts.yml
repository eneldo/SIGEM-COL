groups:
  - name: sigem_availability
    rules:
      - alert: BackendTargetDown
        expr: up{job="sigem-backend"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Backend target is down"
          description: "Prometheus cannot scrape backend:8000/metrics for 2 minutes."

      - alert: BackendHighErrorRate
        expr: |
          sum(rate(http_requests_total{job="sigem-backend",status=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{job="sigem-backend"}[5m]))
          > 0.05
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "5xx error rate above 5%"
          description: "More than 5% of backend responses are 5xx over the last 5 minutes."

      - alert: BackendHighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{job="sigem-backend"}[5m])))
          > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Backend p95 latency above 1s"
          description: "p95 request latency has been above 1 second for 10 minutes."

  - name: sigem_capacity
    rules:
      - alert: PostgresConnectionsSaturation
        expr: |
          sum(pg_stat_activity_count)
          /
          sum(pg_settings_max_connections)
          > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL connections above 80%"
          description: "Database connection usage exceeds 80% of max_connections for 5 minutes. Requires a postgres_exporter scrape target."

      - alert: DiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay",mountpoint!~"/var/lib/docker/.*"}
          /
          node_filesystem_size_bytes{fstype!~"tmpfs|overlay",mountpoint!~"/var/lib/docker/.*"}
          < 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Filesystem below 10% free"
          description: "Less than 10% free space on a monitored filesystem for 10 minutes. Requires a node_exporter scrape target."
