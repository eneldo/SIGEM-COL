[pytest]
testpaths = tests
norecursedirs = .* manual *.egg *.venv venv node_modules
asyncio_mode = auto
addopts =
    -v
    --tb=short
    --strict-markers
    --cov=src/backend
    --cov-report=term-missing
    --cov-config=src/backend/pyproject.toml
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests
    security: Security tests
    slow: Slow tests
